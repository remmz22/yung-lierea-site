<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1d"/>
      <stop offset="1" stop-color="#171331"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- clapperboard -->
  <g transform="rotate(-6 380 300)" filter="url(#g)">
    <rect x="220" y="240" width="330" height="220" rx="10" fill="#111631" stroke="#22d3ee" stroke-width="4"/>
    <rect x="220" y="180" width="330" height="60" rx="8" fill="#1a2145" stroke="#22d3ee" stroke-width="4"/>
    <g fill="#05060f">
      <path d="M245 182 L285 240 L317 240 L277 182 Z"/>
      <path d="M320 182 L360 240 L392 240 L352 182 Z"/>
      <path d="M395 182 L435 240 L467 240 L427 182 Z"/>
      <path d="M470 182 L510 240 L542 240 L502 182 Z"/>
    </g>
    <g fill="#a5b4fc" font-family="monospace" font-size="17" opacity=".9">
      <text x="245" y="300">SAHNE 04</text>
      <text x="245" y="330">TAKE 17</text>
      <text x="245" y="372" fill="#f472b6">YUNG LIEREA</text>
      <text x="245" y="402">BURSA / 2026</text>
    </g>
    <circle cx="510" cy="415" r="20" fill="none" stroke="#f472b6" stroke-width="3"/>
    <line x1="510" y1="415" x2="522" y2="403" stroke="#f472b6" stroke-width="3"/>
  </g>
  <!-- camera -->
  <g transform="translate(590 250) rotate(8)" filter="url(#g)">
    <rect x="-50" y="-30" width="100" height="66" rx="10" fill="#111631" stroke="#a855f7" stroke-width="4"/>
    <circle cx="30" cy="2" r="16" fill="#05060f" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="30" cy="2" r="26" fill="none" stroke="#a855f7" stroke-width="2" opacity=".6"/>
    <rect x="-64" y="-14" width="16" height="32" rx="4" fill="#1a2145" stroke="#a855f7" stroke-width="3"/>
    <circle cx="-10" cy="-40" r="7" fill="#f472b6"/>
  </g>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#818cf8" letter-spacing="6">SAHNE ARKASI</text>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>

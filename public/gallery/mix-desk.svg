<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e1c"/>
      <stop offset="1" stop-color="#121024"/>
    </linearGradient>
    <linearGradient id="fader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- console body -->
  <path d="M80 240 L720 240 L760 520 L40 520 Z" fill="#0e1226" stroke="#312e81" stroke-width="3"/>
  <ellipse cx="400" cy="200" rx="330" ry="50" fill="#a855f7" opacity=".1" filter="url(#g)"/>
  <!-- fader track -->
  <g stroke="#312e81" stroke-width="6" stroke-linecap="round">
    <line x1="180" y1="290" x2="180" y2="470"/>
    <line x1="260" y1="290" x2="260" y2="470"/>
    <line x1="340" y1="290" x2="340" y2="470"/>
    <line x1="420" y1="290" x2="420" y2="470"/>
    <line x1="500" y1="290" x2="500" y2="470"/>
    <line x1="580" y1="290" x2="580" y2="470"/>
  </g>
  <!-- fader knobs -->
  <g filter="url(#g)">
    <rect x="162" y="330" width="36" height="26" rx="6" fill="url(#fader)"/>
    <rect x="242" y="392" width="36" height="26" rx="6" fill="url(#fader)" opacity=".9"/>
    <rect x="322" y="300" width="36" height="26" rx="6" fill="url(#fader)" opacity=".85"/>
    <rect x="402" y="418" width="36" height="26" rx="6" fill="url(#fader)" opacity=".95"/>
    <rect x="482" y="345" width="36" height="26" rx="6" fill="url(#fader)" opacity=".8"/>
    <rect x="562" y="376" width="36" height="26" rx="6" fill="url(#fader)" opacity=".9"/>
  </g>
  <!-- vu meter -->
  <g fill="#05060f" stroke="#1e1b4b" stroke-width="2">
    <rect x="640" y="290" width="70" height="180" rx="8"/>
  </g>
  <g filter="url(#g)">
    <rect x="652" y="440" width="16" height="22" rx="3" fill="#22d3ee" opacity=".9"/>
    <rect x="672" y="416" width="16" height="46" rx="3" fill="#22d3ee" opacity=".7"/>
    <rect x="692" y="380" width="16" height="82" rx="3" fill="#a855f7" opacity=".8"/>
    <rect x="652" y="345" width="16" height="90" rx="3" fill="#a855f7" opacity=".6"/>
    <rect x="672" y="330" width="16" height="80" rx="3" fill="#f472b6" opacity=".7"/>
    <rect x="692" y="300" width="16" height="72" rx="3" fill="#f472b6" opacity=".5"/>
  </g>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#818cf8" letter-spacing="6">MIX MASASI</text>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>

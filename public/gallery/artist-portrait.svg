<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0616"/>
      <stop offset="1" stop-color="#150b2b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".38" r=".5">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".45" r=".8">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="300" rx="330" ry="300" fill="url(#halo)"/>
  <g opacity=".25" stroke="#a855f7" stroke-width="1">
    <circle cx="400" cy="300" r="240" fill="none"/>
    <circle cx="400" cy="300" r="290" fill="none" opacity=".6"/>
    <circle cx="400" cy="300" r="340" fill="none" opacity=".3"/>
  </g>
  <!-- hooded figure -->
  <g>
    <path d="M400 250
             C 320 250 275 320 272 410
             C 270 480 285 545 310 600
             L 490 600
             C 515 545 530 480 528 410
             C 525 320 480 250 400 250 Z"
          fill="#0c0819" stroke="url(#rim)" stroke-width="4"/>
    <!-- hood -->
    <path d="M400 165
             C 330 165 285 225 285 300
             C 285 330 295 355 310 370
             C 305 300 330 240 400 235
             C 470 240 495 300 490 370
             C 505 355 515 330 515 300
             C 515 225 470 165 400 165 Z"
          fill="#100a22" stroke="url(#rim)" stroke-width="4"/>
    <!-- face shadow -->
    <ellipse cx="400" cy="310" rx="62" ry="74" fill="#05030c"/>
    <!-- neon eyes hint -->
    <g filter="url(#glow)">
      <path d="M368 305 q14 10 28 0" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M404 305 q14 10 28 0" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- chain -->
    <g stroke="#f472b6" stroke-width="5" fill="none" filter="url(#glow)">
      <path d="M330 480 Q 400 560 470 480" opacity=".9"/>
      <circle cx="400" cy="527" r="14" stroke-width="4"/>
    </g>
  </g>
  <!-- equalizer bottom -->
  <g fill="url(#rim)" filter="url(#glow)" opacity=".9">
    <rect x="150" y="660" width="12" height="34" rx="4"/>
    <rect x="176" y="644" width="12" height="66" rx="4" opacity=".8"/>
    <rect x="202" y="652" width="12" height="50" rx="4" opacity=".9"/>
    <rect x="586" y="648" width="12" height="58" rx="4" opacity=".85"/>
    <rect x="612" y="638" width="12" height="78" rx="4" opacity=".75"/>
    <rect x="638" y="656" width="12" height="42" rx="4" opacity=".9"/>
  </g>
  <text x="400" y="745" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#e2e8f0" letter-spacing="10" opacity=".9">YUNG LIEREA</text>
  <text x="400" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#a5b4fc" letter-spacing="6">TRAP × ALTERNATIVE R&B</text>
  <rect width="800" height="800" fill="url(#vig)"/>
</svg>

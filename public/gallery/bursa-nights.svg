<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090616"/>
      <stop offset=".7" stop-color="#1b1040"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="moonG" cx=".5" cy=".5" r=".5">
      <stop offset=".7" stop-color="#fbcfe8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fbcfe8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="620" cy="130" r="120" fill="url(#moonG)"/>
  <circle cx="620" cy="130" r="46" fill="#fbcfe8" filter="url(#g)"/>
  <g fill="#fff" opacity=".8">
    <circle cx="80" cy="70" r="2"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="300" cy="60" r="2"/><circle cx="420" cy="110" r="1.5"/>
    <circle cx="520" cy="50" r="1.6"/><circle cx="240" cy="160" r="1.2"/>
  </g>
  <!-- skyline -->
  <g fill="#0a0716">
    <rect x="0" y="330" width="90" height="270"/>
    <rect x="100" y="380" width="70" height="220"/>
    <rect x="180" y="300" width="110" height="300"/>
    <rect x="300" y="400" width="80" height="200"/>
    <rect x="390" y="340" width="100" height="260"/>
    <rect x="500" y="410" width="70" height="190"/>
    <rect x="580" y="350" width="110" height="250"/>
    <rect x="700" y="390" width="100" height="210"/>
  </g>
  <!-- mosque silhouette (Ulucami) -->
  <g fill="#070512">
    <rect x="200" y="420" width="200" height="180"/>
    <path d="M230 420 Q230 350 265 350 Q300 350 300 420 Z" opacity="0"/>
    <circle cx="245" cy="392" r="26"/>
    <rect x="241" y="340" width="8" height="22"/>
    <circle cx="355" cy="392" r="26"/>
    <rect x="351" y="340" width="8" height="22"/>
    <path d="M280 420 Q300 330 320 420" opacity="0"/>
    <path d="M230 420 Q 300 360 370 420 Z" opacity="0"/>
  </g>
  <!-- windows -->
  <g fill="#f472b6" filter="url(#g)">
    <rect x="30" y="360" width="8" height="12" opacity=".9"/>
    <rect x="60" y="400" width="8" height="12" opacity=".7"/>
    <rect x="210" y="330" width="8" height="12" opacity=".8"/>
    <rect x="260" y="360" width="8" height="12" opacity=".6"/>
    <rect x="420" y="380" width="8" height="12" opacity=".85"/>
    <rect x="450" y="420" width="8" height="12" opacity=".7"/>
    <rect x="620" y="390" width="8" height="12" opacity=".8"/>
    <rect x="660" y="430" width="8" height="12" opacity=".65"/>
    <rect x="730" y="420" width="8" height="12" opacity=".75"/>
  </g>
  <g fill="#22d3ee" filter="url(#g)">
    <rect x="130" y="410" width="8" height="12" opacity=".8"/>
    <rect x="160" y="450" width="8" height="12" opacity=".6"/>
    <rect x="320" y="430" width="8" height="12" opacity=".7"/>
    <rect x="540" y="440" width="8" height="12" opacity=".75"/>
    <rect x="760" y="460" width="8" height="12" opacity=".6"/>
  </g>
  <!-- reflection -->
  <rect y="560" width="800" height="40" fill="#a855f7" opacity=".12"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#c4b5fd" letter-spacing="10" opacity=".8">BURSA GECELERİ</text>
</svg>

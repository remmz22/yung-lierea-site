<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a1f"/>
      <stop offset=".6" stop-color="#2b1055"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#sky)"/>
  <g filter="url(#g)">
    <circle cx="320" cy="330" r="95" fill="url(#sun)"/>
  </g>
  <rect y="330" width="640" height="4" fill="#0a0a1f" opacity="0"/>
  <g mask="url(#m)">
    <circle cx="320" cy="330" r="95" fill="url(#sun)" opacity=".35"/>
  </g>
  <mask id="m">
    <rect x="0" y="330" width="640" height="310" fill="#fff"/>
  </mask>
  <g stroke="#05060f" stroke-width="7" stroke-linecap="round">
    <line x1="150" y1="345" x2="490" y2="345"/>
    <line x1="120" y1="372" x2="520" y2="372"/>
    <line x1="90" y1="399" x2="550" y2="399"/>
    <line x1="60" y1="426" x2="580" y2="426"/>
  </g>
  <g fill="#ffffff" opacity=".8">
    <circle cx="90" cy="90" r="2"/>
    <circle cx="200" cy="60" r="1.5"/>
    <circle cx="480" cy="100" r="2"/>
    <circle cx="560" cy="50" r="1.5"/>
    <circle cx="380" cy="45" r="1.2"/>
  </g>
  <text x="40" y="86" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#fff" letter-spacing="3">YENİ DOĞMUŞUM</text>
  <text x="40" y="612" font-family="Arial, sans-serif" font-size="16" fill="#fbcfe8" letter-spacing="8">YUNG LIEREA</text>
  <text x="600" y="612" text-anchor="end" font-family="monospace" font-size="16" fill="#c4b5fd">125 BPM</text>
  <rect width="640" height="640" fill="url(#vig)"/>
</svg>
